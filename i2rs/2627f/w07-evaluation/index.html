mizde değildi): hold-out puanların bir kesrini saklar ve gerçek doğruluğu olduğundan düşük gösterme eğilimindedir; aynı veriyi hem ayar hem test için kullanmak doğruluğu çok abartır; çapraz doğrulama puanları q eşit parçaya böler ve q test parçası üzerinden ortalama alır; leave-one-out, q'nun puan sayısı eksi bire eşit olduğu durumdur."},"cite":{"narrative":{"en":"Aggarwal (2016)","tr":"Aggarwal (2016)"},"parenthetical":{"en":"(Aggarwal, 2016)","tr":"(Aggarwal, 2016)"}},"locator":null,"cited_by":[{"slide":"split","steps":[1,3,5]}]},{"id":"ev-corr-textbook","kind":"textbook","ref":"aggarwal2016","script":null,"hash":null,"claim":{"en":"Aggarwal (2016), Chapter 7, section 7.5.2 (idea adapted; page not verified): ranking by correlation compares the ground-truth order with the predicted order, must not punish ties in the ground truth, and uses Spearman and Kendall (concordant minus discordant pairs over the pairs).","tr":"Aggarwal (2016), Böl. 7, §7.5.2 (fikir uyarlandı; sayfa doğrulanmadı): korelasyonla sıralama, gerçek sırayı tahmin edilen sırayla karşılaştırır, gerçek sıradaki beraberlikleri cezalandırmamalıdır ve Spearman ile Kendall'ı (uyumlu eksi uyumsuz çiftler bölü çiftler) kullanır."},"cite":{"narrative":{"en":"Aggarwal (2016)","tr":"Aggarwal (2016)"},"parenthetical":{"en":"(Aggarwal, 2016)","tr":"(Aggarwal, 2016)"}},"locator":null,"cited_by":[{"slide":"rank-corr","steps":[1]}]},{"id":"ev-roc-textbook","kind":"textbook","ref":"aggarwal2016","script":null,"hash":null,"claim":{"en":"Aggarwal (2016), Chapter 7, section 7.5.4 and Figure 7.4 (idea adapted, redrawn with our own list; page not verified): ROC and precision-recall curves show the trade-off as the recommended list grows; a perfect oracle is best, a random ranking lies on the diagonal, two algorithms can dominate on different parts of the curve, and the area under the curve is a proxy for overall effectiveness although not all parts are equally important.","tr":"Aggarwal (2016), Böl. 7, §7.5.4 ve Şekil 7. 3"}},"cited_by":[{"slide":"why-evaluate","steps":[3]},{"slide":"paradigms","steps":[1,2,3]},{"slide":"summary","steps":[1]}]},{"id":"ev-zangerle-share","kind":"paper","ref":"zangerle2022","script":null,"hash":null,"claim":{"en":"Zangerle and Bauer (2022), footnote 5 on p. 11 of the PDF, quoting Jannach and Bauer (2020): more than 92% of the 117 recommender papers at AAAI and IJCAI in 2018 and 2019 relied exclusively on offline experiments; at ACM RecSys 2018 and 2019 three of four papers used offline evaluations only. A second-hand figure: we have not read the original.","tr":"Zangerle ve Bauer (2022), PDF s. 11, dipnot 5, Jannach ve Bauer'den (2020) aktararak: AAAI ve IJCAI 2018 ve 2019'daki 117 öneri makalesinin %92'den fazlası yalnız çevrimdışı deneylere dayandı; ACM RecSys 2018 ve 2019'da dört makalenin üçü yalnız çevrimdışı değerlendirme kullandı. İkinci elden bir sayı: aslını okumadık."},"cite":{"narrative":{"en":"Zangerle and Bauer (2022, p. 11)","tr":"Zangerle ve Bauer (2022, p. 11)"},"parenthetical":{"en":"(Zangerle \u0026 Bauer, 2022, p. 11)","tr":"(Zangerle ve Bauer, 2022, p. 11)"}},"locator":{"page":"11","pages":null,"para":null,"table":null,"figure":null,"text":{"en":"p. 11","tr":"p. 11"}},"cited_by":[{"slide":"paradigms","steps":[4]}]},{"id":"ev-gunawardana-classes","kind":"paper","ref":"zangerle2022","script":null,"hash":null,"claim":{"en":"Zangerle and Bauer (2022), p. 19 of the PDF: Gunawardana et al. distinguish prediction accuracy (rating prediction accuracy, usage prediction, ranking measures), coverage, novelty, serendipity, diversity and confidence.","tr":"Zangerle ve Bauer (2022), PDF s. 19: Gunawardana vd. tahmin doğruluğunu (puan tahmini doğruluğu, kullanım tahmini, sıralama ölçüleri), kapsamı, yeniliği, serendipity'yi, çeşitliliği ve emin olmayı ayırır."},"cite":{"narrative":{"en":"Zangerle and Bauer (2022, p. 19)","tr":"Zangerle ve Bauer (2022, p. 19)"},"parenthetical":{"en":"(Zangerle \u0026 Bauer, 2022, p. 19)","tr":"(Zangerle ve Bauer, rediction, each prediction half a star off (MAE 0.50, RMSE 0.50); a seventh pair, rated 5 and predicted 2, gives MAE 0.86 and RMSE 1.22 (our computation, ev-toy-numbers). An example, not a measurement.","tr":"Uydurma altı puan-tahmin çifti, her tahmin yarım yıldız şaşar (MAE 0,50, RMSE 0,50); puanı 5, tahmini 2 olan yedinci bir çift MAE 0,86 ve RMSE 1,22 verir (kendi hesabımız, ev-toy-numbers). Bir örnek, bir ölçüm değil."},"cite":null,"locator":null,"cited_by":[{"slide":"rating-error","steps":[1,2,3]}]},{"id":"ev-confusion-toy","kind":"hypothetical","ref":null,"script":null,"hash":null,"claim":{"en":"Invented counts TP 40, FP 10, FN 20, TN 130: accuracy 170 / 200 = 0.85; of 1,000 users, 20 like the item, and a system recommending nothing has accuracy 980 / 1,000 = 0.98 and finds 0 of 20 (our computation, ev-toy-numbers). An example, not a measurement.","tr":"Uydurma sayılar TP 40, FP 10, FN 20, TN 130: doğruluk 170 / 200 = 0,85; 1.000 kullanıcıdan 20'si öğeyi beğenir ve hiçbir şey önermeyen bir sistemin doğruluğu 980 / 1.000 = 0,98'dir, 20'den 0'ını bulur (kendi hesabımız, ev-toy-numbers). Bir örnek, bir ölçüm değil."},"cite":null,"locator":null,"cited_by":[{"slide":"confusion","steps":[1,2,4,5]}]},{"id":"ev-matrix-toy","kind":"hypothetical","ref":null,"script":null,"hash":null,"claim":{"en":"Invented counts TP 40, FP 10, FN 20, TN 130: precision 40 / 50 = 0.80, recall 40 / 60 = 0.67, specificity 130 / 140 = 0.93, F1 = 80 / 110 = 0.73; invented precision-recall pairs for one famous band (0.90 and 0.15, F1 0.26, plain average 0.53) and for all of rock (0.30 and 1.00, F1 0.46, plain average 0.65); the pairs come from two invented matrices of 500 items, 60 of them liked: one famous band with TP 9, FP 1, FN 51, TN 439 (precision 9 / 10, recall 9 / 60, F1 18 / 70) and all of rock with TP 60, FP 140, FN 0, TN 300 (precision 60 / 200, recall 60 / 60, F1 120 / 260); all our computation (ev-toy-numbers); the bands are invented too. An example, not a measurement.","tr":"Uydurma sayılar TP 40, FP 10, FN 20, TN 130: kesinlik 40 / 50 = 0,80, duyarlılık 40 / 60 = 0,67, özgüllük 130 / 140 = 0,93, F1 = 80 / 110 = 0,73; tek bir ünlü grup (0,90 ve 0,15, F1 0,26, düz ortalama 0,53) ve bütün rock (0,30 ve 1,00, F1 0,46, düz ortalama 0,65) için uydurma kesinlik-duyarlılık çiftleri; çiftler, 60'ı beğenilen 500 öğelik iki uydurma matristen gelir: tek ünlü grup TP 9, FP 1, FN 51, TN 439 (kesinlik 9 / 10, duyarlılık 9 / 60, F1 18 / 70) ve bütün rock TP 60, FP 140, FN 0, TN 300 (kesinlik 60 / 200, duyarlılık 60 / 60, F1 120 / 260); hepsi kendi hesabımız (ev-toy-numbers); gruplar da uydurmadır. Bir örnek, bir ölçüm değil."},"cite":null,"locator":null,"cited_by":[{"slide":"precision-recall","steps":[1,2,3,4,5,6]}]},{"id":"ev-leakage-toy","kind":"hypothetical","ref":null,"script":null,"hash":null,"claim":{"en":"Invented pair of toy leaderboards of our own: under a random split, algorithm A leads (0.82 against 0.78); under a temporal split, algorithm B leads (0.66 against 0.61). Not measured; the slide carries the label synthetic data (D-129). The measured range of Kendall tau belongs to ev-meng-split.","tr":"Kendi uydurma oyuncak liderlik tablosu çiftimiz: rastgele bölmede algoritma A önde (0,82'ye karşı 0,78); zamansal bölmede algoritma B önde (0,66'ya karşı 0,61). Ölçülmemiştir; slayt sentetik veri etiketini taşır (D-129). Kendall tau'nun ölçülmüş aralığı ev-meng-split'e aittir."},"cite":null,"locator":null,"cited_by":[{"slide":"leakage","steps":[5]}]},{"id":"ev-coverage-toy","kind":"hypothetical","ref":null,"script":null,"hash":null,"claim":{"en":"Invented toy catalogue of twenty films with two algorithms: algorithm A recommends 5 distinct films in all, algorithm B 14, so catalogue coverage is 5 / 20 = 25% and 14 / 20 = 70%; a toy grid of 6 users by 8 films in which 33 of 48 cells can be predicted (prediction coverage 69%), with one new user and one new film for which nothing can be predicted (our computation, ev-toy-numbers). An example, not a measurement.","tr":"Uydurma yirmi filmlik bir katalog ve iki algoritma: A algoritması toplam 5 farklı film, B algoritması 14 öneriyor; katalog kapsamı 5 / 20 = %25 ve 14 / 20 = %70; 6 kullanıcı x 8 filmlik, 48 hücrenin 33'ünün tahmin edilebildiği (tahmin kapsamı %69) ve yeni bir kullanıcı ile yeni bir film için hiçbir şeyin tahmin edilemediği oyuncak bir ızgara (kendi hesabımız, ev-toy-numbers). Bir örnek, bir ölçüm değil."},"cite":null,"locator":null,"cited_by":[{"slide":"coverage","steps":[1,2,3,4]}]},{"id":"ev-diversity-toy","kind":"hypothetical","ref":null,"script":null,"hash":null,"claim":{"en":"Invented lists of three films with invented pairwise similarities: 0.8, 0.9 and 0.7 for the list of one genre and 0.2, 0.3 and 0.1 for the list of three genres; the intra-list diversity, the mean of 1 - similarity, is 0.20 and 0.80 (our computation, ev-toy-numbers). An example, not a measurement.","tr":"Uydurma üç filmlik listeler ve uydurma ikili benzerlikler: tek türlü liste için 0,8, 0,9 ve 0,7, üç türlü liste için 0,2, 0,3 ve 0,1; liste içi çeşitlilik, 1 - benzerliğin ortalaması, 0,20 ve 0,80'dir (kendi hesabımız, ev-toy-numbers). Bir örnek, bir ölçüm değil."},"cite":null,"locator":null,"cited_by":[{"slide":"diversity","steps":[1,2]}]},{"id":"ev-roc-toy","kind":"hypothetical","ref":null,"script":null,"hash":null,"claim":{"en":"Invented ranked lists of ten items with five relevant ones: list A has them at ranks 1, 2, 3, 9, 10 and list B at ranks 2, 4, 5, 6, 7; AUC of A 15 / 25 = 0.60 and of B 16 / 25 = 0.64 (our computation, ev-toy-numbers). An example, not a measurement.","tr":"Beşi ilgili, on öğelik uydurma sıralı listeler: A listesinde ilgili öğeler 1, 2, 3, 9, 10. sırada, B listesinde 2, 4, 5, 6, 7. sırada; A'nın AUC'si 15 / 25 = 0,60, B'ninki 16 / 25 = 0,64 (kendi hesabımız, ev-toy-numbers). Bir örnek, bir ölçüm değil."},"cite":null,"locator":null,"cited_by":[{"slide":"roc","steps":[1,2,4]}]},{"id":"ev-seeds-toy","kind":"hypothetical","ref":null,"script":null,"hash":null,"claim":{"en":"Invented dots inside the measured bands of the picture: eight invented deviations from the mean for one random split and eight for cross-validation, drawn only to show a spread; the bands themselves (6.3% and 2.3%) are measured (ev-wegmeth). The slide carries the label synthetic data (D-129).","tr":"Resmin ölçülmüş bantlarının içindeki uydurma noktalar: tek rastgele bölme için ortalamadan sekiz, çapraz doğrulama için sekiz uydurma sapma, yalnız bir yayılımı göstermek için çizilmiştir; bantların kendisi (%6,3 ve %2,3) ölçülmüştür (ev-wegmeth). Slayt sentetik veri etiketini taşır (D-129)."},"cite":null,"locator":null,"cited_by":[{"slide":"one-run","steps":[1]}]},{"id":"ev-exposure-toy","kind":"hypothetical","ref":null,"script":null,"hash":null,"claim":{"en":"Invented toy matrix of 6 users by 8 films with rated, shown-but-unrated and never-shown cells, an invented histogram of the ratings if every film were rated, and invented average errors of 0.7 for popular and 1.1 for long-tail films, drawn to show the direction of the effect (the measured statement is ev-steck2011). The slide carries the label synthetic data (D-129).","tr":"6 kullanıcı x 8 filmlik, puanlanmış, gösterilmiş ama puanlanmamış ve hiç gösterilmemiş hücreli uydurma oyuncak matris, her film puanlansaydı puanların uydurma histogramı ve popüler filmler için 0,7, uzun kuyruk filmler için 1,1 uydurma ortalama hata; etkinin yönünü göstermek için çizilmiştir (ölçülmüş ifade ev-steck2011'dir). Slayt sentetik veri etiketini taşır (D-129)."},"cite":null,"locator":null,"cited_by":[{"slide":"mnar","steps":[3]}]},{"id":"ev-toy-numbers","kind":"our-computation","ref":null,"script":"scripts/evaluation_numbers.py","hash":"sha256:a10eeeafd484073a576f7fb8b5ba723ef3408a8b14a4eafee6961598d3b129ef","claim":{"en":"Our own hand-checkable computation of the toy numbers of the deck: MAE and RMSE of six half-star errors and of the same plus one error of 3 (0.50 and 0.50; 0.86 and 1.22); the confusion measures of 40, 10, 20 and 130 and the accuracy 0.98 of recommending nothing; F1 of the famous band and of all of rock; P@10 0.40, P@20 0.25, R@10 0.67 and R@20 0.83 for relevant items at ranks 1, 3, 4, 8 and 14 with six relevant in all; HR@10 0.60 and ARHR 0.35 for hidden items at ranks 1, 2, 4, 15 and 40; the discounts 1.00, 0.63, 0.50, 0.43, 0.39; DCG 6.15, ideal 6.32 and NDCG 0.97 for gains 3, 2, 3, 0, 1; NDCG 1.00 and 0.25 for a perfect item at rank 1 and at rank 15; the factor 1.585 between rank 1 and rank 2; Spearman 0.80 and Kendall 0.60 for the order BACED, and 0.74 with a tie of D and E; the R-score weights 1.00, 0.84, 0.71, 0.59, 0.50; the NDCG values of Rendle's example from its ranks (0.150, 0.122, 0.208); the toy conversion rates; coverage 25% and 70% and the toy prediction grid (33 of 48); the AUC of the toy ROC lists (0.60 and 0.64); the intra-list diversity 0.20 and 0.80.","tr":"Destenin oyuncak sayılarının elle denetlenebilir kendi hesabımız: altı yarım yıldızlık hatanın ve aynısına 3'lük bir hata eklenmişinin MAE ve RMSE'si (0,50 ve 0,50; 0,86 ve 1,22); 40, 10, 20 ve 130'un karışıklık ölçüleri ve hiçbir şey önermemenin 0,98 doğruluğu; ünlü grubun ve bütün rock'ın F1'i; toplam altı ilgili öğe ve 1., 3., 4., 8. ve 14. sıralardaki ilgili öğeler için P@10 0,40, P@20 0,25, R@10 0,67 ve R@20 0,83; gizli öğeleri 1., 2., 4., 15. ve 40. sırada olan kullanıcılar için HR@10 0,60 ve ARHR 0,35; 1,00, 0,63, 0,50, 0,43, 0,39 indirimleri; 3, 2, 3, 0, 1 kazançları için DCG 6,15, ideal 6,32 ve NDCG 0,97; mükemmel bir öğe 1. ve 15. sırada iken NDCG 1,00 ve 0,25; 1. ve 2. sıra arasındaki 1,585 çarpanı; BACED sırası için Spearman 0,80 ve Kendall 0,60, D ile E'nin beraberliğiyle 0,74; R-score ağırlıkları 1,00, 0,84, 0,71, 0,59, 0,50; Rendle'ın örneğinin NDCG değerleri sıralarından (0,150, 0,122, 0,208); oyuncak dönüşüm oranları; %25 ve %70 kapsam ve oyuncak tahmin ızgarası (48'de 33); oyuncak ROC listelerinin AUC'si (0,60 ve 0,64); liste içi çeşitlilik 0,20 ve 0,80."},"cite":null,"locator":null,"cited_by":[{"slide":"top-k","steps":[2,3,5]},{"slide":"ndcg","steps":[1,2,3,4]},{"slide":"rank-corr","steps":[1,2]}]},{"id":"ev-netflix-shares","kind":"our-computation","ref":null,"script":"scripts/evaluation_numbers.py","hash":"sha256:a10eeeafd484073a576f7fb8b5ba723ef3408a8b14a4eafee6961598d3b129ef","claim":{"en":"Our own computation from the published counts of Feuerverger, He and Khatri (2012, p. 4 of the reprint): of 103,297,638 ratings, training without the probe is 99,072,112 (95.909%), the probe 1,408,395 (1.363%), the quiz half 1,408,342 (1.363%) and the test half 1,408,789 (1.364%); the matrix of 480,189 users by 17,770 films is 98.8% empty; the shares are the textbook's Figure 7.1(b), recomputed. The movie-average gain of Cinematch is 9.63%; the Grand Prize threshold 0.9 x 0.9525 is 0.85725, which the rules state as 0.8572.","tr":"Feuerverger, He ve Khatri'nin (2012, yeniden baskı s. 4) yayımlanmış adetlerinden kendi hesabımız: 103.297.638 puanın 99.072.112'si (%95,909) probe hariç eğitim, 1.408.395'i (%1,363) probe, 1.408.342'si (%1,363) quiz yarısı ve 1.408.789'u (%1,364) test yarısı; 480.189 kullanıcı ve 17.770 filmlik matris %98,8 boştur; paylar ders kitabının Şekil 7.1(b)'sidir, yeniden hesaplandı. Cinematch'in film ortalamasına göre kazancı %9,63'tür; Büyük Ödül eşiği 0,9 x 0,9525 = 0,85725'tir, kurallar bunu 0,8572 diye belirtir."},"cite":null,"locator":null,"cited_by":[{"slide":"netflix-data","steps":[4]}]},{"id":"ev-herlocker-grocery","kind":"paper","ref":"herlocker2004","script":null,"hash":null,"claim":{"en":"Herlocker et al. (2004), p. 14: for a supermarket recommender it would be almost always correct, but useless, to recommend bananas, bread, milk and eggs; the recommendations might be correct, but they do not change the shopper's behaviour.","tr":"Herlocker vd. (2004), s. 14: bir market öneri sistemi için muz, ekmek, süt ve yumurta önermek hemen hep doğru ama yararsız olurdu; öneriler doğru olabilir, ama alışverişçinin davr  rarity, not whether an object is new to a given user. Quote (p. 4513): \"To measure this we use the self-information or \"surprisal\" (30) of recommended objects, which measures the unexpectedness of an object relative to its global popularity.\" Page: read in the five-page typeset reprint of pp. 4511-4515 from the University of Fribourg repository (folia.unifr.ch, document 301635); the (D2) paragraph and the formula are on its page 3, and with the article starting at p. 4511 that is p. 4513. The reprint's own folio reads 3, so the PNAS page is counted from the page range, not printed on the copy. The content was also read in the arXiv version (0808.2670v3) and in PubMed Central (PMC2842039).","tr":"Zhou vd. (2010), PNAS 107(10), s. 4513, 'Recommendation performance metrics' bölümü, '(D2) Surprisal/novelty' alt bölümü: bir nesnenin öz-bilgisi I = log2(u / k)'dır; u kullanıcı sayısı, k nesneyi toplayan kullanıcı sayısıdır (derecesi); bir kullanıcının ilk L nesnesi üzerindeki ortalama bir listenin sürprizini ölçer (makale L = 20 kullanır). Nesnenin küresel popülerliğine göre beklenmezliğini ölçer, yani bir nadirlik ölçüsüdür; bir nesnenin belirli bir kullanıcıya yeni olup olmadığını ölçmez. Alıntı (s. 4513): \"To measure this we use the self-information or \"surprisal\" (30) of recommended objects, which measures the unexpectedness of an object relative to its global popularity.\" (kabaca: bunu ölçmek için önerilen nesnelerin öz-bilgisini ya da sürprizini kullanırız; bu, bir nesnenin küresel popülerliğine göre beklenmezliğini ölçer). Sayfa: Fribourg Üniversitesi deposundan (folia.unifr.ch, belge 301635), 4511-4515 sayfalarının dizilmiş beş sayfalık baskısından okundu; (D2) paragrafı ve formül onun 3. sayfasındadır, makale s. 4511'de başladığı için bu s. 4513'tür. Baskının kendi folyosu 3 yazar; yani PNAS sayfası kopyada basılı değil, sayfa aralığından sayılmıştır. İçerik arXiv sürümünde (0808.2670v3) ve PubMed Central'da (PMC2842039) da okundu."},"cite":{"narrative":{"en":"Zhou et al. (2010, p. 4513)","tr":"Zhou vd. (2010, p. 4513)"},"parenthetical":{"en":"(Zhou et al., 2010, p. 4513)","tr":"(Zhou vd., 2010, p. 4513)"}},"locator":{"page":"4513","pages":null,"para":null,"table":null,"figure":null,"text":{"en":"p. 4513","tr":"p. 4513"}},"cited_by":[{"slide":"novelty","steps":[5]}]},{"id":"ev-shani-novelty","kind":"paper","ref":"shani2009","script":null,"hash":null,"claim":{"en":"Shani and Gunawardana (MSR-TR-2009-159, pp. 27-28 of the report), section 3.6: novel recommendations are recommendations for items that the user did not know about; novelty can be measured in a user study by asking whether the user was familiar with the item, or approximated offline by hiding ratings in time; as popular items are less likely to be novel, an accuracy metric can give less credit for popular items (p. 28); novelty has to be controlled for accuracy, because irrelevant recommendations may be new yet worthless (p. 28).","tr":"Shani ve Gunawardana (MSR-TR-2009-159, raporun s. 27-28), 3.6: yeni öneriler, kullanıcının bilmediği öğelerin önerileridir; yenilik bir kullanıcı çalışmasında kullanıcının öğeyi tanıyıp tanımadığı sorularak ölçülebilir ya da çevrimdışı puanları zamanda gizleyerek yaklaşık hesaplanabilir; popüler öğelerin yeni olma olasılığı daha düşük olduğundan bir doğruluk ölçütü popüler öğelere daha az kredi verebilir (s. 28); yenilik doğrulukla birlikte denetlenmelidir, çünkü ilgisiz öneriler yeni ama değersiz olabilir (s. 28)."},"cite":{"narrative":{"en":"Shani and Gunawardana (2009, pp. 27–28)","tr":"Shani ve Gunawardana (2009, pp. 27–28)"},"parenthetical":{"en":"(Shani \u0026 Gunawardana, 2009, pp. 27–28)","tr":"(Shani ve Gunawardana, 2009, pp. 27–28)"}},"locator":{"page":null,"pages":"27–28","para":null,"table":null,"figure":null,"text":{"en":"pp. 27–28","tr":"pp. 27–28"}},"cited_by":[{"slide":"novelty","steps":[5]}]},{"id":"ev-shani-serendipity","kind":"paper","ref":"shani2009","script":null,"hash":null,"claim":{"en":"Shani and Gunawardana (MSR-TR-2009-159, p. 29 of the report), section 3.7: serendipity is a measure of how surprising the successful recommendations are; random recommendations may be very surprising, so serendipity has to be balanced with accuracy; it can also be seen as the deviation from the 'natural' prediction of an accurate engine (Murakami et al. 2008), the items such an engine deems unlikely being the surprising ones.","tr":"Shani ve Gunawardana (MSR-TR-2009-159, raporun s. 29), 3.7: serendipity başarılı önerilerin ne kadar şaşırtıcı olduğunun ölçüsüdür; rastgele öneriler çok şaşırtıcı olabilir, bu yüzden serendipity doğrulukla dengelenmelidir; doğru bir motorun 'doğal' tahmininden sapma olarak da düşünülebilir (Murakami vd. 2008), böyle bir motorun olası görmediği öğeler şaşırtıcı olanlardır."},"cite":{"narrative":{"en":"Shani and Gunawardana (2009, p. 29)","tr":"Shani ve Gunawardana (2009, p. 29)"},"parenthetical":{"en":"(Shani \u0026 Gunawardana, 2009, p. 29)","tr":"(Shani ve Gunawardana, 2009, p. 29)"}},"locator":{"page":"29","pages":null,"para":null,"table":null,"figure":null,"text":{"en":"p. 29","tr":"p. 29"}},"cited_by":[{"slide":"novelty","steps":[6]}]},{"id":"ev-novelty-numbers","kind":"our-computation","ref":null,"script":"scripts/evaluation_numbers.py","hash":"sha256:a10eeeafd484073a576f7fb8b5ba723ef3408a8b14a4eafee6961598d3b129ef","claim":{"en":"Our own computation with invented counts: 1,024 users, three films held by 512, 128 and 8 of them, so the self-information log2(u / k) is 1, 3 and 7 bits and the mean of the list is 11 / 3 = 3.67 bits; for serendipity a list of ten items of which a primitive recommender also recommends six, so 10 - 6 = 4 are unexpected (items 3, 6, 8, 10) and three of these are liked: 3 / 4 = 0.75. The counts are made up to be hand-checkable; the formulas are those of ev-zhou-selfinfo and ev-ge-serendipity.","tr":"Uydurma sayılarla kendi hesabımız: 1.024 kullanıcı, bunlardan 512, 128 ve 8'inin elinde olan üç film; öz-bilgi log2(u / k) 1, 3 ve 7 bit, listenin ortalaması 11 / 3 = 3,67 bit; serendipity için on öğelik bir liste, bunların altısını ilkel bir öneri sistemi de önerir; yani 10 - 6 = 4 öğe beklenmedik (3, 6, 8, 10) ve bunların üçü beğenilir: 3 / 4 = 0,75. Sayılar elle denetlenebilsin diye uydurulmuştur; formüller ev-zhou-selfinfo ve ev-ge-serendipity'ninkidir."},"cite":null,"locator":null,"cited_by":[{"slide":"novelty","steps":[5,6]}]},{"id":"ev-shani-confidence","kind":"paper","ref":"shani2009","script":null,"hash":null,"claim":{"en":"Shani and Gunawardana (MSR-TR-2009-159, p. 26 of the report), section 3.4: confidence is the system's trust in its own predictions; the most common measurement is the probability that the predicted value is true, or the interval around the predicted value in which a stated share, for example 95 per cent, of the true values lie. Example 1 hides part of the ratings and counts how often the prediction falls inside (A+) and outside (A-) the interval: the true confidence is A+ / (A- + A+), 0.97 for algorithm A and 0.94 for B, and B is preferred because it is closer to the requested 95 per cent.","tr":"Shani ve Gunawardana (MSR-TR-2009-159, raporun s. 26), 3.4: emin olma, sistemin kendi tahminlerine güvenidir; en yaygın ölçüsü tahmin edilen değerin doğru olma olasılığı ya da gerçek değerlerin belirtilen payının, örneğin yüzde 95'inin, içinde kaldığı, tahmin çevresindeki aralıktır. Örnek 1 puanların bir kısmını gizler ve tahminin aralığın içine (A+) ve dışına (A-) kaç kez düştüğünü sayar: gerçek güven A+ / (A- + A+)'dır, A algoritması için 0,97, B için 0,94; istenen yüzde 95'e daha yakın olduğundan B tercih edilir."},"cite":{"narrative":{"en":"Shani and Gunawardana (2009, p. 26)","tr":"Shani ve Gunawardana (2009, p. 26)"},"parenthetical":{"en":"(Shani \u0026 Gunawardana, 2009, p. 26)","tr":"(Shani ve Gunawardana, 2009, p. 26)"}},"locator":{"page":"26","pages":null,"para":null,"table":null,"figure":null,"text":{"en":"p. 26","tr":"p. 26"}},"cited_by":[{"slide":"trust-system","steps":[1]}]},{"id":"ev-shani-trust","kind":"paper","ref":"shani2009","script":null,"hash":null,"claim":{"en":"Shani and Gunawardana (MSR-TR-2009-159, p. 27 of the report), section 3.5: trust is the user's trust in the system's recommendations, not the system's trust in its ratings; the obvious method of evaluating it is to ask the users in a user study; online, the number of recommendations that were followed, or repeat use, can stand in for it, but such measurements may not separate other factors of user satisfaction; how to measure trust in an offline experiment is unclear.","tr":"Shani ve Gunawardana (MSR-TR-2009-159, raporun s. 27), 3.5: güven, kullanıcının sistemin önerilerine güvenidir, sistemin kendi puanlarına güveni değildir; değerlendirmenin açık yolu bir kullanıcı çalışmasında kullanıcılara sormaktır; çevrimiçi uyulan öneri sayısı ya da tekrar kullanım onun yerine geçebilir, ama bu ölçümler kullanıcı memnuniyetinin öteki etkenlerinden iyi ayrılmayabilir; çevrimdışı bir deneyde güvenin nasıl ölçüleceği belirsizdir."},"cite":{"narrative":{"en":"Shani and Gunawardana (2009, p. 27)","tr":"Shani ve Gunawardana (2009, p. 27)"},"parenthetical":{"en":"(Shani \u0026 Gunawardana, 2009, p. 27)","tr":"(Shani ve Gunawardana, 2009, p. 27)"}},"locator":{"page":"27","pages":null,"para":null,"table":null,"figure":null,"text":{"en":"p. 27","tr":"p. 27"}},"cited_by":[{"slide":"trust-system","steps":[1]}]},{"id":"ev-shani-robustness","kind":"paper","ref":"shani2009","script":null,"hash":null,"claim":{"en":"Shani and Gunawardana (MSR-TR-2009-159, pp. 32-33 of the report), section 3.11: robustness is the stability of the recommendation in the presence of fake information, typically inserted on purpose (attacks, for example fake profiles that rate a hotel positively); no system is immune to every attack, so it is more useful to estimate the cost of influencing a recommendation, typically measured by the amount of injected information, and, when theory is not possible, to simulate attacks and measure empirically the average cost of a successful attack (p. 33); the attack protocol has to be described completely, because the sensitivity varies with it; an attack on a real system is hard to run as an online experiment (p. 33).","tr":"Shani ve Gunawardana (MSR-TR-2009-159, raporun s. 32-33), 3.11: sağlamlık, tipik olarak bilerek eklenen sahte bilgi karşısında önerinin kararlılığıdır (saldırılar, örneğin bir oteli olumlu puanlayan sahte profiller); hiçbir sistem her saldırıya karşı bağışık değildir, bu yüzden bir öneriyi etkilemenin maliyetini, tipik olarak eklenen bilgi miktarıyla, tahmin etmek daha kullanışlıdır ve kuram mümkün değilse saldırılar simüle edilip başarılı bir saldırının ortalama maliyeti deneysel ölçülür (s. 33); saldırı protokolü eksiksiz anlatılmalıdır, çünkü duyarlılık ona göre değişir; gerçek bir sisteme saldırı çevrimiçi deney olarak yürütülemez (s. 33)."},"cite":{"narrative":{"en":"Shani and Gunawardana (2009, pp. 32–33)","tr":"Shani ve Gunawardana (2009, pp. 32–33)"},"parenthetical":{"en":"(Shani \u0026 Gunawardana, 2009, pp. 32–33)","tr":"(Shani ve Gunawardana, 2009, pp. 32–33)"}},"locator":{"page":null,"pages":"32–33","para":null,"table":null,"figure":null,"text":{"en":"pp. 32–33","tr":"pp. 32–33"}},"cited_by":[{"slide":"trust-system","steps":[2]}]},{"id":"ev-shani-scalability","kind":"paper","ref":"shani2009","script":null,"hash":null,"claim":{"en":"Shani and Gunawardana (MSR-TR-2009-159, p. 35 of the report), section 3.14: scalability is typically measured by experimenting with growing datasets and showing how speed and resource consumption (computation, memory) behave as the task scales up; as recommendations are often given online, one measure is the throughput, the number of recommendations the system can give per second, and another the latency (response time), the time needed to make one recommendation online.","tr":"Shani ve Gunawardana (MSR-TR-2009-159, raporun s. 35), 3.14: ölçeklenebilirlik tipik olarak büyüyen veri kümeleriyle deney yaparak, görev büyürken hız ve kaynak tüketiminin (hesaplama, bellek) nasıl davrandığını göstererek ölçülür; öneriler çoğu zaman çevrimiçi verildiğinden bir ölçü verimdir (sistemin saniyede verebildiği öneri sayısı), bir diğeri gecikmedir (yanıt süresi), yani bir öneriyi çevrimiçi vermek için gereken süredir."},"cite":{"narrative":{"en":"Shani and Gunawardana (2009, p. 35)","tr":"Shani ve Gunawardana (2009, p. 35)"},"parenthetical":{"en":"(Shani \u0026 Gunawardana, 2009, p. 35)","tr":"(Shani ve Gunawardana, 2009, p. 35)"}},"locator":{"page":"35","pages":null,"para":null,"table":null,"figure":null,"text":{"en":"p. 35","tr":"p. 35"}},"cited_by":[{"slide":"trust-system","steps":[3]}]},{"id":"ev-trust-numbers","kind":"our-computation","ref":null,"script":"scripts/evaluation_numbers.py","hash":"sha256:a10eeeafd484073a576f7fb8b5ba723ef3408a8b14a4eafee6961598d3b129ef","claim":{"en":"Our own computation with invented counts, the first two after the example of ev-shani-confidence: of 100 hidden ratings 97 fall inside the stated 95 per cent interval for A (0.97) and 94 for B (0.94), so B is closer to 0.95; of 400 recommendations shown, 60 were followed: 60 / 400 = 15 per cent; three simulated attacks that succeed with 8, 12 and 10 injected fake profiles cost on average (8 + 12 + 10) / 3 = 10 profiles; 1,200 recommendations in 6 seconds are 200 per second; a latency of 40 ms for one recommendation; the latency for 1, 2 and 4 million ratings is 20, 40 and 80 ms, so it doubles when the data double. Made up to be hand-checkable.","tr":"Uydurma sayılarla kendi hesabımız, ilk ikisi ev-shani-confidence örneğinden esinle: saklanan 100 puanın A için 97'si (0,97), B için 94'ü (0,94) belirtilen yüzde 95'lik aralığa düşer, yani B 0,95'e daha yakındır; gösterilen 400 öneriden 60'ına uyuldu: 60 / 400 = yüzde 15; sırasıyla 8, 12 ve 10 sahte profille başarılı olan üç simüle saldırının ortalama maliyeti (8 + 12 + 10) / 3 = 10 profildir; 6 saniyede 1.200
