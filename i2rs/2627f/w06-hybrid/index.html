ems are, by definition, hybrid systems, but the converse is not necessarily true (the textbook's own generalization; no page given).","tr":"Aggarwal (2016), Böl. 6: tüm topluluk sistemleri tanım gereği hibrit sistemlerdir, ama tersi zorunlu olarak doğru değildir (kitabın kendi genellemesi; sayfa verilmedi)."},"cite":{"narrative":{"en":"Aggarwal (2016)","tr":"Aggarwal (2016)"},"parenthetical":{"en":"(Aggarwal, 2016)","tr":"(Aggarwal, 2016)"}},"locator":null,"cited_by":[{"slide":"taxonomy","steps":[1]}]},{"id":"ev-aggarwal-fig62","kind":"textbook","ref":"aggarwal2016","script":null,"hash":null,"claim":{"en":"Aggarwal (2016), Figure 6.2, redrawn (idea adapted): in a parallel ensemble the same input goes to q recommenders and a combiner joins their outputs; in a sequential ensemble the recommenders form a chain that also ends in a combiner, and dashed arrows may carry the original input to the later recommenders and the earlier outputs (P1, P2) to the combiner.","tr":"Aggarwal (2016), Şekil 6.2, yeniden çizildi (fikir uyarlandı): paralel toplulukta aynı girdi q öneri sistemine gider ve bir birleştirici çıktıları birleştirir; ardışık toplulukta öneri sistemleri bir zincir oluşturur, zincir de bir birleştiriciyle biter ve kesikli oklar özgün girdiyi sonraki öneri sistemlerine, önceki çıktıları (P1, P2) birleştiriciye taşıyabilir."},"cite":{"narrative":{"en":"Aggarwal (2016)","tr":"Aggarwal (2016)"},"parenthetical":{"en":"(Aggarwal, 2016)","tr":"(Aggarwal, 2016)"}},"locator":null,"cited_by":[{"slide":"designs","steps":[1,2]}]},{"id":"ev-galton-ox","kind":"paper","ref":"galton1907","script":null,"hash":null,"claim":{"en":"Galton (1907), p. 450: at a weight-judging competition for a fat ox, 787 usable estimates remained after discarding defective cards; Galton reports the middlemost estimate as 1207 lb against a dressed weight of 1198 lb (0.8 per cent too high). Only the numbers are used.","tr":"Galton (1907), s. 450: besili bir öküzün ağırlığını tahmin yarışmasında kusurlu uadratic loss functions; for classification, where class labels are not numbers, squared loss does not fit and several alternative decompositions have been proposed.","tr":"Bauer ve Kohavi (1999), s. 112: yanlılık-varyans ayrışımı (Geman vd., 1992) kare kayıp işlevli gözetimli öğrenme için bir araçtır; sınıf etiketlerinin sayısal olmadığı sınıflandırmada kare kayıp uygun değildir ve birkaç ayrışım önerilmiştir."},"cite":{"narrative":{"en":"Bauer and Kohavi (1999, p. 112)","tr":"Bauer ve Kohavi (1999, p. 112)"},"parenthetical":{"en":"(Bauer \u0026 Kohavi, 1999, p. 112)","tr":"(Bauer ve Kohavi, 1999, p. 112)"}},"locator":{"page":"112","pages":null,"para":null,"table":null,"figure":null,"text":{"en":"p. 112","tr":"p. 112"}},"cited_by":[{"slide":"bias-variance","steps":[6]}]},{"id":"ev-breiman-bagging","kind":"paper","ref":"breiman1996","script":null,"hash":null,"claim":{"en":"Breiman (1996), p. 123: bagging builds several versions of a predictor from bootstrap replicates of the learning set and aggregates them (an average for a numerical outcome, a plurality vote for a class). The abstract is quoted because the sentence is the point: \"The vital element is the instability of the prediction method.\"","tr":"Breiman (1996), s. 123: bagging, öğrenme kümesinin bootstrap kopyalarını yaparak bir tahmincinin birden çok sürümünü üretir ve bunlarla birleşik bir tahminci elde eder (sayısal çıktı için ortalama, sınıf için çoğunluk oyu); hayati unsur tahmin yönteminin kararsızlığıdır (özet)."},"cite":{"narrative":{"en":"Breiman (1996, p. 123)","tr":"Breiman (1996, p. 123)"},"parenthetical":{"en":"(Breiman, 1996, p. 123)","tr":"(Breiman, 1996, p. 123)"}},"locator":{"page":"123","pages":null,"para":null,"table":null,"figure":null,"text":{"en":"p. 123","tr":"p. 123"}},"cited_by":[{"slide":"families","steps":[1]}]},{"id":"ev-bk-voting","kind":"paper","ref":"bauer1999","script":null,"hash":null,"claim":{"en":"Bauer and Kohavi (1999), abstract, p. 105: bagging lowered the variance of un
